<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>P2P Remote Control</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #111;
    color: white;

    font-family:
        Arial,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    overflow: hidden;
}

button {

    font-family: inherit;

    cursor: pointer;

    user-select: none;

    touch-action: manipulation;
}


/* =========================
   上部
========================= */

#topBar {

    height: 55px;

    background: #222;

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 7px;

    border-bottom: 1px solid #444;

    z-index: 100;
}

#topBar button {

    height: 40px;

    padding: 0 12px;

    border: none;

    border-radius: 7px;

    background: #444;

    color: white;

    font-size: 13px;
}

#topBar button:active {

    transform: scale(0.95);
}

#status {

    margin-left: auto;

    font-size: 12px;

    color: #aaa;

    white-space: nowrap;
}


/* =========================
   メイン
========================= */

#main {

    width: 100%;
    height: calc(100% - 55px);

    display: flex;
}


/* =========================
   左
========================= */

#leftPanel {

    width: 260px;

    min-width: 260px;

    background: #181818;

    border-right: 1px solid #333;

    padding: 10px;

    overflow-y: auto;
}

#leftPanel h3 {

    margin: 5px 0 10px;

    font-size: 15px;
}

.info {

    background: #222;

    padding: 9px;

    border-radius: 7px;

    margin-bottom: 8px;

    font-size: 12px;
}

#myPeerId {

    color: #64b5f6;

    word-break: break-all;

    margin-top: 5px;
}

#connectionPeerId {

    color: #81c784;

    word-break: break-all;

    margin-top: 5px;
}

#qrcode {

    width: 220px;

    height: 220px;

    margin: 10px auto;

    padding: 5px;

    background: white;

    border-radius: 5px;
}

#startShare {

    width: 100%;

    height: 42px;

    border: none;

    border-radius: 7px;

    background: #ff9800;

    color: white;

    font-size: 14px;
}

#startShare:active {

    transform: scale(0.97);
}

#log {

    height: 170px;

    background: #080808;

    border: 1px solid #333;

    border-radius: 5px;

    padding: 6px;

    overflow-y: auto;

    font-family: monospace;

    font-size: 10px;

    white-space: pre-wrap;
}


/* =========================
   画面
========================= */

#screenArea {

    flex: 1;

    min-width: 0;
    min-height: 0;

    position: relative;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;
}

#remoteVideo {

    width: 100%;

    height: 100%;

    object-fit: contain;

    background: black;

    display: block;
}

#tapPoint {

    position: absolute;

    width: 26px;

    height: 26px;

    border: 3px solid red;

    border-radius: 50%;

    transform: translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 50;
}


/* =========================
   キーボード
========================= */

#keyboard {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 1000;

    background: #171717;

    border-top: 1px solid #444;

    padding: 6px;

    display: none;

    flex-direction: column;

    gap: 4px;

    max-height: 50vh;

    overflow-y: auto;
}

#keyboard.visible {

    display: flex;
}

.keyboardRow {

    display: flex;

    gap: 4px;

    width: 100%;
}

.key {

    flex: 1;

    min-width: 0;

    height: 40px;

    border: 1px solid #555;

    border-radius: 5px;

    background: #303030;

    color: white;

    font-size: 12px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.key:active,
.key.active {

    background: #666;

    transform: translateY(1px);
}

.wide {

    flex: 1.7;
}

.space {

    flex: 5;
}

.function {

    background: #252525;

    font-size: 10px;
}

.special {

    background: #3b3b3b;
}

.ime {

    background: #1565c0 !important;
}

.enter {

    background: #388e3c;
}

.backspace {

    background: #8e3030;
}


/* =========================
   スマホ
========================= */

@media (max-width: 700px) {

    #leftPanel {

        display: none;
    }

    #topBar {

        height: 50px;
    }

    #main {

        height: calc(100% - 50px);
    }

    #topBar button {

        padding: 0 7px;

        font-size: 11px;
    }

    #status {

        font-size: 9px;
    }

    .key {

        height: 38px;

        font-size: 10px;
    }
}


/* =========================
   全画面
========================= */

body.fullscreen #topBar {

    display: none;
}

body.fullscreen #main {

    height: 100%;
}

body.fullscreen #leftPanel {

    display: none;
}

</style>

<script>

/* =========================================================
   設定
========================================================= */

const PYTHON_SERVER =
    "http://127.0.0.1:5000";


/* =========================================================
   DOM
========================================================= */

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const screenArea =
    document.getElementById(
        "screenArea"
    );

const tapPoint =
    document.getElementById(
        "tapPoint"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const logEl =
    document.getElementById(
        "log"
    );

const keyboard =
    document.getElementById(
        "keyboard"
    );


/* =========================================================
   ログ
========================================================= */

function log(text) {

    const time =
        new Date().toLocaleTimeString();

    logEl.textContent +=
        `[${time}] ${text}\n`;

    logEl.scrollTop =
        logEl.scrollHeight;
}


/* =========================================================
   Peer
========================================================= */

let peer = null;

let connection = null;


/* =========================================================
   Peer作成
========================================================= */

function createPeer() {

    /*
     * GitHub PagesはHTTPSなので
     * PeerJS CloudもHTTPS/443を明示
     */

    peer = new Peer({

        host: "0.peerjs.com",

        port: 443,

        path: "/",

        secure: true,

        debug: 2

    });


    /* =========================
       自分のPeer ID
    ========================= */

    peer.on(
        "open",
        id => {

            document.getElementById(
                "myPeerId"
            ).textContent = id;

            log(
                "Peer接続成功"
            );

            log(
                "PC Peer ID: " + id
            );

            statusEl.textContent =
                "QR読み取り待機中";

            createQRCode(id);

            /*
             * URLにtargetがある場合は
             * スマホ側なのでPCへ接続
             */

            connectToTarget();

        }
    );


    /* =========================
       スマホから接続
    ========================= */

    peer.on(
        "connection",
        conn => {

            log(
                "スマホから接続要求"
            );

            setupConnection(conn);

        }
    );


    /* =========================
       映像受信
    ========================= */

    peer.on(
        "call",
        call => {

            log(
                "映像通話を受信"
            );

            /*
             * スマホ側からPCへ
             * 映像が送られてきた場合
             */

            call.answer();

            call.on(
                "stream",
                stream => {

                    remoteVideo.srcObject =
                        stream;

                    remoteVideo.play()
                        .catch(() => {});

                    log(
                        "映像受信開始"
                    );

                }
            );

        }
    );


    /* =========================
       Peerエラー
    ========================= */

    peer.on(
        "error",
        error => {

            console.error(error);

            log(
                "Peer ERROR: " +
                error.type
            );

            statusEl.textContent =
                "接続エラー: " +
                error.type;

        }
    );


    peer.on(
        "disconnected",
        () => {

            log(
                "PeerServerから切断"
            );

            statusEl.textContent =
                "再接続中...";

            setTimeout(
                () => {

                    if (
                        peer &&
                        peer.disconnected
                    ) {

                        peer.reconnect();

                    }

                },
                1000
            );

        }
    );

}


/* =========================================================
   QR
========================================================= */

function createQRCode(peerId) {

    const box =
        document.getElementById(
            "qrcode"
        );

    box.innerHTML = "";


    /*
     * 現在開いているGitHub PagesのURL
     *
     * 例:
     *
     * https://xxx.github.io/P2P_WebRTC_TEST/
     *
     * ↓
     *
     * https://xxx.github.io/P2P_WebRTC_TEST/?target=ABC123
     */

    const url =
        new URL(
            location.href
        );

    url.search = "";

    url.hash = "";

    url.searchParams.set(
        "target",
        peerId
    );


    log(
        "QR URL: " +
        url.toString()
    );


    new QRCode(
        box,
        {

            text:
                url.toString(),

            width: 210,

            height: 210,

            correctLevel:
                QRCode.CorrectLevel.M

        }
    );

}


/* =========================================================
   targetへ接続
========================================================= */

function connectToTarget() {

    const params =
        new URLSearchParams(
            location.search
        );

    const target =
        params.get("target");


    /*
     * targetなし
     * = PC側
     */

    if (!target) {

        log(
            "PCモード"
        );

        return;

    }


    /*
     * targetあり
     * = スマホ側
     */

    log(
        "スマホモード"
    );

    log(
        "接続先: " + target
    );


    statusEl.textContent =
        "PCへ接続中...";


    const conn =
        peer.connect(
            target,
            {

                reliable: true,

                serialization: "json"

            }
        );


    setupConnection(conn);

}


/* =========================================================
   DataConnection
========================================================= */

function setupConnection(conn) {

    connection = conn;


    /*
     * 接続先Peer ID
     */

    document.getElementById(
        "connectionPeerId"
    ).textContent =
        conn.peer;


    log(
        "接続先Peer: " +
        conn.peer
    );


    conn.on(
        "open",
        () => {

            log(
                "★★★★★ P2P接続成功 ★★★★★"
            );

            statusEl.textContent =
                "📱 接続済み";

        }
    );


    conn.on(
        "data",
        data => {

            log(
                "DATA受信: " +
                JSON.stringify(data)
            );

            handleData(data);

        }
    );


    conn.on(
        "close",
        () => {

            log(
                "P2P接続終了"
            );

            connection = null;

            statusEl.textContent =
                "切断";

            document.getElementById(
                "connectionPeerId"
            ).textContent =
                "未接続";

        }
    );


    conn.on(
        "error",
        error => {

            console.error(error);

            log(
                "DataConnection ERROR: " +
                error
            );

            statusEl.textContent =
                "データ接続エラー";

        }
    );

}


/* =========================================================
   DATA処理
========================================================= */

function handleData(data) {

    if (!data) {
        return;
    }


    /*
     * スマホからクリック
     */

    if (
        data.type === "click"
    ) {

        sendClickToPython(
            data.x,
            data.y
        );

        return;

    }


    /*
     * スマホからキー
     */

    if (
        data.type === "key"
    ) {

        sendKeyToPython(
            data.key
        );

        return;

    }

}


/* =========================================================
   PC → スマホ
   画面共有
========================================================= */

document
    .getElementById("startShare")
    .addEventListener(
        "click",
        async () => {

            /*
             * スマホが接続しているか
             */

            if (
                !connection ||
                !connection.open
            ) {

                alert(
                    "先にスマートフォンをQRコードから接続してください。"
                );

                log(
                    "画面共有失敗: スマホ未接続"
                );

                return;

            }


            try {

                log(
                    "画面共有を開始..."
                );


                /*
                 * PC画面取得
                 */

                const stream =
                    await navigator
                        .mediaDevices
                        .getDisplayMedia({

                            video: {

                                cursor:
                                    "always"

                            },

                            audio: false

                        });


                /*
                 * PC画面を自分にも表示
                 */

                remoteVideo.srcObject =
                    stream;

                remoteVideo.play()
                    .catch(() => {});


                /*
                 * ★ここが重要
                 *
                 * 接続済みスマホの
                 * Peer IDへ直接call
                 */

                const call =
                    peer.call(
                        connection.peer,
                        stream
                    );


                call.on(
                    "error",
                    error => {

                        console.error(error);

                        log(
                            "映像送信ERROR: " +
                            error
                        );

                    }
                );


                call.on(
                    "close",
                    () => {

                        log(
                            "映像送信終了"
                        );

                    }
                );


                log(
                    "スマホへ画面送信開始"
                );


                /*
                 * 画面共有終了
                 */

                stream
                    .getVideoTracks()[0]
                    .addEventListener(
                        "ended",
                        () => {

                            log(
                                "画面共有終了"
                            );

                        }
                    );

            }
            catch (error) {

                console.error(error);

                log(
                    "画面共有ERROR: " +
                    error.message
                );

            }

        }
    );


/* =========================================================
   クリック
========================================================= */

screenArea.addEventListener(
    "click",
    event => {

        if (
            event.target !==
                remoteVideo &&
            event.target !==
                screenArea
        ) {

            return;

        }


        sendScreenCoordinate(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   タッチ
========================================================= */

screenArea.addEventListener(
    "touchstart",
    event => {

        if (
            !event.touches.length
        ) {

            return;

        }


        const touch =
            event.touches[0];


        sendScreenCoordinate(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: true
    }
);


/* =========================================================
   座標変換
========================================================= */

function sendScreenCoordinate(
    clientX,
    clientY
) {

    const rect =
        remoteVideo
            .getBoundingClientRect();


    if (
        clientX < rect.left ||
        clientX > rect.right ||
        clientY < rect.top ||
        clientY > rect.bottom
    ) {

        return;

    }


    const videoWidth =
        remoteVideo.videoWidth;

    const videoHeight =
        remoteVideo.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        return;

    }


    const containerWidth =
        rect.width;

    const containerHeight =
        rect.height;


    const videoRatio =
        videoWidth /
        videoHeight;

    const containerRatio =
        containerWidth /
        containerHeight;


    let displayWidth;
    let displayHeight;

    let offsetX;
    let offsetY;


    if (
        containerRatio >
        videoRatio
    ) {

        displayHeight =
            containerHeight;

        displayWidth =
            displayHeight *
            videoRatio;

        offsetX =
            (
                containerWidth -
                displayWidth
            ) / 2;

        offsetY = 0;

    }
    else {

        displayWidth =
            containerWidth;

        displayHeight =
            displayWidth /
            videoRatio;

        offsetX = 0;

        offsetY =
            (
                containerHeight -
                displayHeight
            ) / 2;

    }


    const x =
        clientX -
        rect.left -
        offsetX;

    const y =
        clientY -
        rect.top -
        offsetY;


    if (
        x < 0 ||
        y < 0 ||
        x > displayWidth ||
        y > displayHeight
    ) {

        return;

    }


    const videoX =
        Math.round(
            x *
            videoWidth /
            displayWidth
        );

    const videoY =
        Math.round(
            y *
            videoHeight /
            displayHeight
        );


    /*
     * 赤丸
     */

    tapPoint.style.left =
        clientX + "px";

    tapPoint.style.top =
        clientY + "px";

    tapPoint.style.display =
        "block";


    clearTimeout(
        window.tapTimer
    );


    window.tapTimer =
        setTimeout(
            () => {

                tapPoint.style.display =
                    "none";

            },
            300
        );


    log(
        `クリック X=${videoX} Y=${videoY}`
    );


    /*
     * Python
     */

    sendClickToPython(
        videoX,
        videoY
    );

}


/* =========================================================
   Pythonクリック
========================================================= */

async function sendClickToPython(
    x,
    y
) {

    try {

        await fetch(
            PYTHON_SERVER +
            "/click",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        x: x,

                        y: y

                    })

            }
        );

    }
    catch (error) {

        console.error(error);

        log(
            "Python接続エラー"
        );

    }

}

document
    .getElementById(
        "fullscreenBtn"
    )
    .addEventListener(
        "click",
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                    document.body
                        .classList
                        .add("fullscreen");

                }
                else {

                    await document
                        .exitFullscreen();

                    document.body
                        .classList
                        .remove(
                            "fullscreen"
                        );

                }

            }
            catch (error) {

                console.error(error);

            }

        }
    );

/* =========================================================
   キーボード
========================================================= */

let shiftPressed = false;
let ctrlPressed = false;
let altPressed = false;
let winPressed = false;


document
    .querySelectorAll(".key")
    .forEach(
        button => {

            button.addEventListener(
                "pointerdown",
                event => {

                    event.preventDefault();


                    const key =
                        button.dataset.key;


                    /*
                     * Shift
                     */

                    if (
                        key === "SHIFT"
                    ) {

                        shiftPressed =
                            !shiftPressed;

                        button
                            .classList
                            .toggle(
                                "active",
                                shiftPressed
                            );

                        sendKeyToPython(
                            shiftPressed
                                ? "SHIFT_DOWN"
                                : "SHIFT_UP"
                        );

                        return;

                    }


                    /*
                     * Ctrl
                     */

                    if (
                        key === "CTRL"
                    ) {

                        ctrlPressed =
                            !ctrlPressed;

                        button
                            .classList
                            .toggle(
                                "active",
                                ctrlPressed
                            );

                        sendKeyToPython(
                            ctrlPressed
                                ? "CTRL_DOWN"
                                : "CTRL_UP"
                        );

                        return;

                    }


                    /*
                     * Alt
                     */

                    if (
                        key === "ALT"
                    ) {

                        altPressed =
                            !altPressed;

                        button
                            .classList
                            .toggle(
                                "active",
                                altPressed
                            );

                        sendKeyToPython(
                            altPressed
                                ? "ALT_DOWN"
                                : "ALT_UP"
                        );

                        return;

                    }


                    /*
                     * Win
                     */

                    if (
                        key === "WIN"
                    ) {

                        winPressed =
                            !winPressed;

                        button
                            .classList
                            .toggle(
                                "active",
                                winPressed
                            );

                        sendKeyToPython(
                            winPressed
                                ? "WIN_DOWN"
                                : "WIN_UP"
                        );

                        return;

                    }


                    /*
                     * 通常キー
                     */

                    sendKeyToPython(
                        key
                    );

                }
            );

        }
    );
