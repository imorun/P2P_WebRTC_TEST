<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>P2P WebRTC 画面共有 + タップ座標</title>

<script src="https://unpkg.com/peerjs/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/qrcode/build/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: sans-serif;
    max-width: 900px;
    margin: 20px auto;
    padding: 0 12px;
    line-height: 1.5;
}

.box {
    border: 1px solid #ccc;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 8px;
    background: #f8f8f8;
}

button {
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
}

button:hover {
    background: #0056b3;
}

input {
    padding: 10px;
    font-size: 15px;
    width: 260px;
    margin-right: 8px;
}

.status {
    font-weight: bold;
    color: #28a745;
}

.qr-container {
    margin-top: 15px;
    text-align: center;
    background: white;
    padding: 12px;
    display: inline-block;
    border: 1px dashed #aaa;
}

#remote-video {
    width: 100%;
    max-width: 850px;

    display: block;

    margin-top: 10px;

    background: #000;

    border: 3px solid #333;

    cursor: crosshair;

    /*
     * スマホでタップしたとき
     * ブラウザのスクロールなどを防ぐ
     */
    touch-action: none;
}

#coordinate {
    font-size: 26px;
    font-weight: bold;
    padding: 10px;
}

#connection-status {
    font-weight: bold;
}

#log {
    background: #111;
    color: #00ff00;

    padding: 12px;

    min-height: 150px;

    white-space: pre-wrap;

    overflow-y: auto;

    font-family: monospace;
}

.small {
    color: #666;
    font-size: 14px;
}

</style>

</head>


<body>

<h1>
WebRTC 画面共有 + タップ座標
</h1>


<!-- ================================================= -->
<!-- 自分のID -->
<!-- ================================================= -->

<div class="box">

<h3>1. PCの情報</h3>

<p>
Peer ID：
<span
    id="my-id"
    class="status"
>
接続中...
</span>
</p>

<p>
DataConnection：
<span
    id="connection-status"
>
未接続
</span>
</p>

<p>
Python：
<span
    id="python-status"
>
確認中...
</span>
</p>

<p>
スマホで下のQRコードを読み取ってください。
</p>

<div class="qr-container">

<canvas id="qrcode-canvas"></canvas>

</div>

</div>


<!-- ================================================= -->
<!-- 手動画面共有 -->
<!-- ================================================= -->

<div class="box">

<h3>2. 手動画面共有</h3>

<input
    type="text"
    id="target-id"
    placeholder="スマホ側のPeer ID"
>

<button
    onclick="startScreenShare()"
>
画面共有開始
</button>

</div>


<!-- ================================================= -->
<!-- 受信画面 -->
<!-- ================================================= -->

<div class="box">

<h3>3. PC画面</h3>

<p>
スマホ側に表示されたPC画面をタップしてください。
</p>

<video
    id="remote-video"
    autoplay
    playsinline
    muted
></video>

</div>


<!-- ================================================= -->
<!-- 座標 -->
<!-- ================================================= -->

<div class="box">

<h3>4. タップ座標</h3>

<div id="coordinate">

X = -<br>
Y = -

</div>

<p class="small">

座標は共有映像の元解像度を基準にしています。

</p>

</div>


<!-- ================================================= -->
<!-- ログ -->
<!-- ================================================= -->

<div class="box">

<h3>5. ログ</h3>

<div id="log"></div>

</div>


<script>


/*
=========================================================
 PeerJS
=========================================================
*/

const peer = new Peer();


let localStream = null;


/*
 * PC側のDataConnection
 *
 * スマホ → PC
 */
let dataConnection = null;


/*
=========================================================
 ログ
=========================================================
*/

function log(message) {

    const element =
        document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    element.textContent +=
        `[${time}] ${message}\n`;

    element.scrollTop =
        element.scrollHeight;
}


/*
=========================================================
 Peer ID取得
=========================================================
*/

peer.on("open", (id) => {

    document.getElementById(
        "my-id"
    ).textContent = id;


    log(
        "Peer接続完了"
    );


    /*
     * URLにPCのPeer IDを入れる
     *
     * 例：
     *
     * https://imorun.github.io/P2P_WebRTC_TEST/?target=xxxxx
     */

    const url =
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "target",
        id
    );


    /*
     * QRコード
     */

    QRCode.toCanvas(

        document.getElementById(
            "qrcode-canvas"
        ),

        url.toString(),

        {
            width: 220,
            margin: 2
        },

        (error) => {

            if (error) {

                console.error(
                    "QRコードエラー",
                    error
                );

            }

        }

    );

});


/*
=========================================================
 Peerエラー
=========================================================
*/

peer.on("error", (error) => {

    console.error(
        "PeerJS error:",
        error
    );

    log(
        "PeerJSエラー: " +
        error.type
    );

});


/*
=========================================================
 スマホからDataConnectionが来る
=========================================================
*/

peer.on("connection", (conn) => {

    log(
        "DataConnection接続要求"
    );


    dataConnection = conn;


    setupDataConnection(
        conn
    );

});


/*
=========================================================
 DataConnection設定
=========================================================
*/

function setupDataConnection(conn) {

    dataConnection = conn;


    conn.on("open", () => {

        document.getElementById(
            "connection-status"
        ).textContent =
            "接続済み";

        document.getElementById(
            "connection-status"
        ).style.color =
            "#28a745";


        log(
            "スマホとのDataConnection接続完了"
        );


        /*
         * 接続確認
         */

        conn.send({
            type: "hello"
        });

    });


    /*
     * スマホからデータを受信
     */

    conn.on("data", (data) => {

        if (!data) {
            return;
        }


        /*
         * タップ座標
         */

        if (
            data.type === "tap"
        ) {

            receiveTap(
                data
            );

        }


        /*
         * 接続確認
         */

        else if (
            data.type === "hello"
        ) {

            log(
                "スマホから接続確認を受信"
            );

        }

    });


    conn.on("close", () => {

        document.getElementById(
            "connection-status"
        ).textContent =
            "切断";

        document.getElementById(
            "connection-status"
        ).style.color =
            "#dc3545";


        log(
            "DataConnection切断"
        );

    });


    conn.on("error", (error) => {

        console.error(
            "DataConnection error:",
            error
        );

        log(
            "DataConnectionエラー"
        );

    });

}


/*
=========================================================
 タップ座標受信
=========================================================
*/

function receiveTap(data) {

    const x =
        Number(data.x);

    const y =
        Number(data.y);


    /*
     * 画面表示
     */

    document.getElementById(
        "coordinate"
    ).innerHTML =
        `X = ${x}<br>Y = ${y}`;


    log(
        `スマホタップ → X=${x}, Y=${y}`
    );


    /*
     * Pythonへ送信
     */

    sendToPython(
        x,
        y
    );

}


/*
=========================================================
 Pythonへ座標送信
=========================================================
*/

async function sendToPython(x, y) {

    try {

        const response =
            await fetch(
                "http://127.0.0.1:5000/click",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            x: x,
                            y: y,

                            timestamp:
                                Date.now()

                        })

                    }
                );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if (result.success) {

            document.getElementById(
                "python-status"
            ).textContent =
                "接続済み";

            document.getElementById(
                "python-status"
            ).style.color =
                "#28a745";

        }


    } catch (error) {

        console.error(
            "Python送信エラー:",
            error
        );


        document.getElementById(
            "python-status"
        ).textContent =
            "接続できません";


        document.getElementById(
            "python-status"
        ).style.color =
            "#dc3545";


        log(
            "Pythonへ送信できません"
        );

    }

}


/*
=========================================================
 Pythonサーバー確認
=========================================================
*/

async function checkPython() {

    try {

        const response =
            await fetch(
                "http://127.0.0.1:5000/",
                {
                    method: "GET"
                }
            );


        if (response.ok) {

            document.getElementById(
                "python-status"
            ).textContent =
                "起動中";

            document.getElementById(
                "python-status"
            ).style.color =
                "#28a745";

        }

    } catch (error) {

        document.getElementById(
            "python-status"
        ).textContent =
            "未起動";

        document.getElementById(
            "python-status"
        ).style.color =
            "#dc3545";

    }

}


checkPython();


/*
=========================================================
 画面共有開始
=========================================================
*/

async function startScreenShare() {

    const targetId =
        document
            .getElementById(
                "target-id"
            )
            .value
            .trim();


    if (!targetId) {

        alert(
            "相手のPeer IDを入力してください"
        );

        return;

    }


    try {

        /*
         * PC画面取得
         */

        localStream =
            await navigator
                .mediaDevices
                .getDisplayMedia({

                    video: true,

                    audio: true

                });


        /*
         * PeerJS MediaConnection
         */

        const call =
            peer.call(
                targetId,
                localStream
            );


        log(
            "画面共有開始"
        );


        /*
         * 画面共有終了
         */

        const track =
            localStream
                .getVideoTracks()[0];


        track.onended = () => {

            stopLocalStream();

        };


    } catch (error) {

        console.error(
            error
        );


        log(
            "画面共有開始失敗"
        );


        alert(
            "画面共有を開始できませんでした"
        );

    }

}


/*
=========================================================
 相手から画面共有が来る
=========================================================
*/

peer.on("call", (call) => {

    /*
     * 今回はスマホ側から
     * 画面共有する用途ではないので
     * 空の応答
     */

    call.answer();


    call.on(
        "stream",
        (remoteStream) => {

            const video =
                document.getElementById(
                    "remote-video"
                );


            video.srcObject =
                remoteStream;


            log(
                "画面を受信しました"
            );

        }
    );

});


/*
=========================================================
 スマホ側
=========================================================
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const targetId =
    urlParams.get(
        "target"
    );


/*
 * QRコードからアクセスされた場合
 */

if (targetId) {

    peer.on("open", () => {

        log(
            "QRコードのPC Peer ID: " +
            targetId
        );


        /*
         * PCへDataConnection接続
         */

        const conn =
            peer.connect(
                targetId,
                {
                    reliable: true
                }
            );


        setupDataConnection(
            conn
        );

    });

}


/*
=========================================================
 動画の座標計算
=========================================================
*/

function getVideoCoordinates(
    clientX,
    clientY
) {

    const video =
        document.getElementById(
            "remote-video"
        );


    const rect =
        video.getBoundingClientRect();


    /*
     * 動画表示領域内の座標
     */

    let displayX =
        clientX -
        rect.left;


    let displayY =
        clientY -
        rect.top;


    /*
     * 範囲外なら無視
     */

    if (
        displayX < 0 ||
        displayY < 0 ||
        displayX > rect.width ||
        displayY > rect.height
    ) {

        return null;

    }


    /*
     * 元映像のサイズ
     */

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        return null;

    }


    /*
     * 表示座標
     * ↓
     * 元映像座標
     */

    const x =
        Math.round(
            displayX *
            videoWidth /
            rect.width
        );


    const y =
        Math.round(
            displayY *
            videoHeight /
            rect.height
        );


    return {
        x: x,
        y: y
    };

}


/*
=========================================================
 タップ送信
=========================================================
*/

function sendTap(
    clientX,
    clientY
) {

    const position =
        getVideoCoordinates(
            clientX,
            clientY
        );


    if (!position) {

        return;

    }


    /*
     * DataConnectionがない
     */

    if (
        !dataConnection ||
        !dataConnection.open
    ) {

        log(
            "DataConnection未接続"
        );

        return;

    }


    /*
     * スマホ → PC
     */

    dataConnection.send({

        type: "tap",

        x: position.x,

        y: position.y,

        timestamp:
            Date.now()

    });


    /*
     * スマホ側にも表示
     */

    document.getElementById(
        "coordinate"
    ).innerHTML =
        `X = ${position.x}<br>Y = ${position.y}`;


    log(
        `タップ送信: X=${position.x}, Y=${position.y}`
    );

}


/*
=========================================================
 PCクリック
=========================================================
*/

document
    .getElementById(
        "remote-video"
    )
    .addEventListener(
        "click",
        (event) => {

            sendTap(
                event.clientX,
                event.clientY
            );

        }
    );


/*
=========================================================
 スマホタップ
=========================================================
*/

document
    .getElementById(
        "remote-video"
    )
    .addEventListener(
        "touchend",
        (event) => {

            event.preventDefault();


            if (
                !event.changedTouches ||
                !event.changedTouches.length
            ) {

                return;

            }


            const touch =
                event.changedTouches[0];


            sendTap(
                touch.clientX,
                touch.clientY
            );

        },
        {
            passive: false
        }
    );


/*
=========================================================
 画面共有停止
=========================================================
*/

function stopLocalStream() {

    if (!localStream) {

        return;

    }


    localStream
        .getTracks()
        .forEach(
            track => track.stop()
        );


    localStream = null;


    log(
        "画面共有終了"
    );

}

</script>

</body>

</html>
