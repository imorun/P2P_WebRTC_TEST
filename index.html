<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>P2P WebRTC Remote Control</title>

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<!-- QRCode.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    font-family: Arial, "Yu Gothic", "Meiryo", sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

button {
    font-family: inherit;
    cursor: pointer;
    user-select: none;
}

/* =========================
   上部
========================= */

#topBar {
    height: 55px;
    min-height: 55px;
    background: #222;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px;
    border-bottom: 1px solid #444;
    z-index: 100;
}

#topBar button {
    height: 40px;
    padding: 0 14px;
    border: 0;
    border-radius: 7px;
    background: #444;
    color: white;
    font-size: 14px;
}

#topBar button:hover {
    background: #555;
}

#topBar button:active {
    transform: scale(0.96);
}

#status {
    margin-left: auto;
    font-size: 13px;
    color: #aaa;
    white-space: nowrap;
}

/* =========================
   メイン
========================= */

#main {
    flex: 1;
    min-height: 0;
    display: flex;
    position: relative;
}

/* =========================
   左側
========================= */

#leftPanel {
    width: 260px;
    min-width: 260px;
    background: #181818;
    border-right: 1px solid #333;
    padding: 12px;
    overflow-y: auto;
}

#leftPanel h3 {
    margin: 5px 0 10px;
    font-size: 16px;
}

.info {
    background: #222;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    font-size: 13px;
}

#myPeerId {
    word-break: break-all;
    color: #7dd3fc;
}

#qrcode {
    background: white;
    width: 220px;
    height: 220px;
    margin: 10px auto;
    padding: 5px;
    border-radius: 5px;
}

#qrcode img {
    width: 100%;
    height: 100%;
}

#startShare {
    width: 100%;
    height: 42px;
    border: 0;
    border-radius: 7px;
    background: #ff9800;
    color: white;
    font-size: 15px;
}

#startShare:hover {
    background: #ffa726;
}

#log {
    background: #080808;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 7px;
    height: 180px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
}

/* =========================
   画面
========================= */

#screenArea {
    flex: 1;
    min-width: 0;
    min-height: 0;
    position: relative;
    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;
}

#remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
}

/* タップ座標表示 */
#tapPoint {
    position: absolute;
    width: 25px;
    height: 25px;
    border: 3px solid red;
    border-radius: 50%;
    pointer-events: none;
    display: none;
    transform: translate(-50%, -50%);
    z-index: 50;
}

/* =========================
   キーボード
========================= */

#keyboard {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    background: #171717;
    border-top: 1px solid #444;

    padding: 6px;

    z-index: 1000;

    display: none;
    flex-direction: column;
    gap: 5px;

    max-height: 48vh;
    overflow-y: auto;
}

#keyboard.visible {
    display: flex;
}

.keyboardRow {
    display: flex;
    gap: 4px;
    width: 100%;
}

.key {
    flex: 1;
    min-width: 0;
    height: 42px;

    border: 1px solid #555;
    border-radius: 5px;

    background: #303030;
    color: white;

    font-size: 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: manipulation;
}

.key:hover {
    background: #444;
}

.key:active,
.key.active {
    background: #666;
    transform: translateY(1px);
}

.key.wide {
    flex: 1.7;
}

.key.xwide {
    flex: 2.5;
}

.key.space {
    flex: 5;
}

.key.function {
    background: #252525;
    font-size: 11px;
}

.key.special {
    background: #3b3b3b;
}

.key.ime {
    background: #1565c0;
}

.key.ime.active {
    background: #1976d2;
}

.key.enter {
    background: #388e3c;
}

.key.backspace {
    background: #8e3030;
}

/* =========================
   フルスクリーン
========================= */

body.fullscreen #leftPanel {
    display: none;
}

body.fullscreen #topBar {
    display: none;
}

body.fullscreen #main {
    width: 100vw;
    height: 100vh;
}

/* =========================
   スマホ
========================= */

@media (max-width: 700px) {

    #leftPanel {
        display: none;
    }

    #topBar {
        height: 50px;
        min-height: 50px;
    }

    #topBar button {
        padding: 0 9px;
        font-size: 12px;
    }

    #status {
        font-size: 10px;
    }

    .key {
        height: 38px;
        font-size: 11px;
    }

    #keyboard {
        max-height: 55vh;
    }
}
</style>

<script>

/* =========================================================
   基本設定
========================================================= */

const PYTHON_SERVER = "http://127.0.0.1:5000";

const remoteVideo = document.getElementById("remoteVideo");
const screenArea = document.getElementById("screenArea");
const tapPoint = document.getElementById("tapPoint");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const keyboard = document.getElementById("keyboard");


/* =========================================================
   ログ
========================================================= */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    logEl.textContent +=
        `[${time}] ${message}\n`;

    logEl.scrollTop =
        logEl.scrollHeight;
}


/* =========================================================
   PeerJS
========================================================= */

let peer = null;
let connection = null;

function setStatus(text) {

    statusEl.textContent = text;

}


/* Peer生成 */

function createPeer() {

    peer = new Peer(undefined, {
        debug: 1
    });


    peer.on("open", id => {

        document.getElementById("myPeerId")
            .textContent = id;

        log("Peer ID: " + id);

        setStatus("接続待機中");

        createQRCode(id);

    });


    peer.on("error", err => {

        console.error(err);

        log("Peerエラー: " + err.type);

        setStatus("Peerエラー");

    });


    /*
     * スマホからの接続
     */

    peer.on("connection", conn => {

        connection = conn;

        log("データ接続要求");

        setupDataConnection(conn);

    });


    /*
     * 画面共有受信
     */

    peer.on("call", call => {

        log("映像通話を受信");

        call.answer();

        call.on("stream", stream => {

            remoteVideo.srcObject = stream;

            remoteVideo.play()
                .catch(() => {});

            log("リモート画面を表示");

        });

    });

}


/* =========================================================
   QRコード
========================================================= */

function createQRCode(peerId) {

    const qrcode =
        document.getElementById("qrcode");

    qrcode.innerHTML = "";

    const url =
        location.origin +
        location.pathname +
        "?target=" +
        encodeURIComponent(peerId);

    new QRCode(qrcode, {

        text: url,

        width: 210,

        height: 210,

        correctLevel:
            QRCode.CorrectLevel.M

    });

}


/* =========================================================
   データ接続
========================================================= */

function setupDataConnection(conn) {

    connection = conn;


    conn.on("open", () => {

        log("スマートフォン接続");

        setStatus("📱 スマホ接続済み");

    });


    conn.on("data", data => {

        handleRemoteData(data);

    });


    conn.on("close", () => {

        log("スマートフォン切断");

        setStatus("接続待機中");

        connection = null;

    });


    conn.on("error", err => {

        log("DataConnectionエラー");

        console.error(err);

    });

}


/* =========================================================
   スマホからのデータ
========================================================= */

function handleRemoteData(data) {

    if (!data) return;


    /*
     * タップ
     */

    if (data.type === "click") {

        sendClickToPython(
            data.x,
            data.y
        );

        return;
    }


    /*
     * キー
     */

    if (data.type === "key") {

        sendKeyToPython(
            data.key
        );

        return;
    }


    /*
     * テキスト
     */

    if (data.type === "text") {

        sendTextToPython(
            data.text
        );

        return;
    }

}


/* =========================================================
   画面共有
========================================================= */

document.getElementById("startShare")
    .addEventListener("click", async () => {

        try {

            const stream =
                await navigator.mediaDevices
                    .getDisplayMedia({

                        video: {
                            cursor: "always"
                        },

                        audio: false

                    });


            remoteVideo.srcObject = stream;

            remoteVideo.play()
                .catch(() => {});


            stream
                .getVideoTracks()[0]
                .addEventListener(
                    "ended",
                    () => {

                        log("画面共有終了");

                    }
                );


            /*
             * target がある場合
             * スマホへ映像を送る
             */

            const params =
                new URLSearchParams(
                    location.search
                );

            const target =
                params.get("target");


            if (target) {

                log(
                    "Peer IDへ画面送信: " +
                    target
                );

                const outgoingPeer =
                    new Peer();

                outgoingPeer.on(
                    "open",
                    () => {

                        const call =
                            outgoingPeer.call(
                                target,
                                stream
                            );

                        call.on(
                            "error",
                            err => {
                                console.error(err);
                            }
                        );

                    }
                );

            }


            log("画面共有開始");

        }
        catch (error) {

            console.error(error);

            log(
                "画面共有エラー: " +
                error.message
            );

        }

    });


/* =========================================================
   タップ座標
========================================================= */

screenArea.addEventListener(
    "click",
    event => {

        if (
            event.target !== remoteVideo &&
            event.target !== screenArea
        ) {
            return;
        }

        sendScreenCoordinate(
            event.clientX,
            event.clientY
        );

    }
);


/* タッチ */

screenArea.addEventListener(
    "touchstart",
    event => {

        if (!event.touches.length) {
            return;
        }

        const touch =
            event.touches[0];

        sendScreenCoordinate(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: true
    }
);


/* =========================================================
   画面上の座標を映像座標へ変換
========================================================= */

function sendScreenCoordinate(clientX, clientY) {

    const rect =
        remoteVideo.getBoundingClientRect();


    if (
        clientX < rect.left ||
        clientX > rect.right ||
        clientY < rect.top ||
        clientY > rect.bottom
    ) {
        return;
    }


    const videoWidth =
        remoteVideo.videoWidth;

    const videoHeight =
        remoteVideo.videoHeight;


    if (!videoWidth || !videoHeight) {
        return;
    }


    /*
     * object-fit: contain の黒帯を考慮
     */

    const containerWidth =
        rect.width;

    const containerHeight =
        rect.height;


    const videoRatio =
        videoWidth / videoHeight;

    const containerRatio =
        containerWidth / containerHeight;


    let displayWidth;
    let displayHeight;
    let offsetX;
    let offsetY;


    if (containerRatio > videoRatio) {

        displayHeight =
            containerHeight;

        displayWidth =
            displayHeight * videoRatio;

        offsetX =
            (containerWidth - displayWidth) / 2;

        offsetY = 0;

    }
    else {

        displayWidth =
            containerWidth;

        displayHeight =
            displayWidth / videoRatio;

        offsetX = 0;

        offsetY =
            (containerHeight - displayHeight) / 2;

    }


    const x =
        clientX -
        rect.left -
        offsetX;

    const y =
        clientY -
        rect.top -
        offsetY;


    if (
        x < 0 ||
        y < 0 ||
        x > displayWidth ||
        y > displayHeight
    ) {
        return;
    }


    /*
     * 実際の映像座標
     */

    const videoX =
        Math.round(
            x *
            videoWidth /
            displayWidth
        );

    const videoY =
        Math.round(
            y *
            videoHeight /
            displayHeight
        );


    /*
     * 画面に赤丸
     */

    tapPoint.style.left =
        clientX + "px";

    tapPoint.style.top =
        clientY + "px";

    tapPoint.style.display =
        "block";


    clearTimeout(
        window.tapTimer
    );

    window.tapTimer =
        setTimeout(() => {

            tapPoint.style.display =
                "none";

        }, 300);


    log(
        `タップ X=${videoX} Y=${videoY}`
    );


    sendClickToPython(
        videoX,
        videoY
    );


    /*
     * スマホにも送信
     */

    if (
        connection &&
        connection.open
    ) {

        connection.send({

            type: "click",

            x: videoX,

            y: videoY

        });

    }

}


/* =========================================================
   Pythonへクリック送信
========================================================= */

async function sendClickToPython(x, y) {

    try {

        await fetch(
            PYTHON_SERVER + "/click",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    x: x,

                    y: y

                })

            }
        );

    }
    catch (error) {

        console.error(
            "Python click:",
            error
        );

    }

}


/* =========================================================
   Pythonへキー送信
========================================================= */

async function sendKeyToPython(key) {

    log("キー: " + key);


    try {

        await fetch(
            PYTHON_SERVER + "/key",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    key: key

                })

            }
        );

    }
    catch (error) {

        console.error(
            "Python key:",
            error
        );

    }

}


/* =========================================================
   Pythonへ文字列送信
========================================================= */

async function sendTextToPython(text) {

    try {

        await fetch(
            PYTHON_SERVER + "/text",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    text: text

                })

            }
        );

    }
    catch (error) {

        console.error(
            "Python text:",
            error
        );

    }

}


/* =========================================================
   フルスクリーン
========================================================= */

document.getElementById("fullscreenBtn")
    .addEventListener("click", async () => {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement
                    .requestFullscreen();

                document.body
                    .classList
                    .add("fullscreen");

            }
            else {

                await document.exitFullscreen();

                document.body
                    .classList
                    .remove("fullscreen");

            }

        }
        catch (error) {

            console.error(error);

        }

    });


document.addEventListener(
    "fullscreenchange",
    () => {

        if (document.fullscreenElement) {

            document.body
                .classList
                .add("fullscreen");

        }
        else {

            document.body
                .classList
                .remove("fullscreen");

        }

    }
);


/* =========================================================
   キーボード表示
========================================================= */

document.getElementById("keyboardBtn")
    .addEventListener("click", () => {

        keyboard.classList.toggle(
            "visible"
        );

    });


/* =========================================================
   IME
========================================================= */

let imeMode = "english";


function setIME(mode) {

    imeMode = mode;


    if (mode === "japanese") {

        sendKeyToPython(
            "IME_JAPANESE"
        );

        document.getElementById(
            "japaneseBtn"
        ).classList.add("ime", "active");

        document.getElementById(
            "englishBtn"
        ).classList.remove("active");

        log("入力モード: 日本語");

    }
    else {

        sendKeyToPython(
            "IME_ENGLISH"
        );

        document.getElementById(
            "englishBtn"
        ).classList.add("ime", "active");

        document.getElementById(
            "japaneseBtn"
        ).classList.remove("active");

        log("入力モード: 英数");

    }

}


document.getElementById("japaneseBtn")
    .addEventListener(
        "click",
        () => setIME("japanese")
    );


document.getElementById("englishBtn")
    .addEventListener(
        "click",
        () => setIME("english")
    );


/* =========================================================
   キーボード
========================================================= */

let shiftPressed = false;
let ctrlPressed = false;
let altPressed = false;
let winPressed = false;


/*
 * 通常キー
 */

document
    .querySelectorAll(".key")
    .forEach(button => {


        /*
         * 長押し対応
         */

        button.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                const key =
                    button.dataset.key;


                /*
                 * Shift
                 */

                if (key === "SHIFT") {

                    shiftPressed =
                        !shiftPressed;

                    button.classList.toggle(
                        "active",
                        shiftPressed
                    );

                    sendKeyToPython(
                        shiftPressed
                            ? "SHIFT_DOWN"
                            : "SHIFT_UP"
                    );

                    return;
                }


                /*
                 * Ctrl
                 */

                if (key === "CTRL") {

                    ctrlPressed =
                        !ctrlPressed;

                    button.classList.toggle(
                        "active",
                        ctrlPressed
                    );

                    sendKeyToPython(
                        ctrlPressed
                            ? "CTRL_DOWN"
                            : "CTRL_UP"
                    );

                    return;
                }


                /*
                 * Alt
                 */

                if (key === "ALT") {

                    altPressed =
                        !altPressed;

                    button.classList.toggle(
                        "active",
                        altPressed
                    );

                    sendKeyToPython(
                        altPressed
                            ? "ALT_DOWN"
                            : "ALT_UP"
                    );

                    return;
                }


                /*
                 * Win
                 */

                if (key === "WIN") {

                    winPressed =
                        !winPressed;

                    button.classList.toggle(
                        "active",
                        winPressed
                    );

                    sendKeyToPython(
                        winPressed
                            ? "WIN_DOWN"
                            : "WIN_UP"
                    );

                    return;
                }


                /*
                 * 普通キー
                 */

                sendKeyToPython(key);

            }
        );

    });


/* =========================================================
   QRコードからtargetを取得
========================================================= */

const params =
    new URLSearchParams(
        location.search
    );

const targetPeer =
    params.get("target");


/*
 * target が指定されている場合
 */

if (targetPeer) {

    log(
        "接続先Peer: " +
        targetPeer
    );


    peer.on(
        "open",
        () => {

            try {

                const conn =
                    peer.connect(
                        targetPeer,
                        {
                            reliable: true
                        }
                    );

                setupDataConnection(conn);

            }
            catch (error) {

                console.error(error);

                log(
                    "接続エラー"
                );

            }

        }
    );

}


/* =========================================================
   初期化
========================================================= */

createPeer();

setStatus("Peer接続中...");

log("システム起動");

</script>
